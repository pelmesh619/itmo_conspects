# Код предмета с учетом трека (оно же название каталога)
code: my/mysubject
# Имя предмета
title: Мой предмет
# Имя трека
track_title: Трек от меня
# Номер семестра (нечетные семестры - осенние, четные - весенние)
semester: 1
# Год начала проведения лекций или создания записей
year: 2026
# Модуль дисциплины, доступные значения:
# - mathematics
# - data-management
# - social-and-humanities
# - computer-science
# - software-engineering
# - programming
# - infrastructure-management
# - physics
module: mathematics
# Лектор (по расписанию или количеству проведенных лекций)
lecturer: Иванов И. И.
# Приглашенные гости, которые вели лекцию/лекции в этом курсе
guests:
  - Петров П. П.
# Краткое описание дисциплины
description: Мой предмет - это мой предмет про мой предмет
# Курсы, которые необходимы для изучения этого
prerequisites:
  - code: my/myfirstsubject
    title: Мой первый предмет
    link: my/myfirstsubject/myfirstsubject_superconspect.html
# Похожие курсы
see_also:
  - code: my/myothersubject
    title: Мой другой предмет
    link: my/myothersubject/myothersubject_superconspect.html

# Формат заметок, допустимые значения:
# - md - Markdown
# - typ - Typst
# - tex - TeX
notes_format: md
# Использует ли конспект MathJax для отображения матформул? (false по умолчанию)
uses_mathjax: true
# Ссылка на заметку с информацией об экзамене
exam_list_file: my/myfirstsubject/myfirstsubject_exam_list.html

# Источники, на котором основан курс
based_on:
  - type: textbook
    ref: Умная книга от умного издателя
  - type: article
    ref: Умная статья от умного ученого
  - type: course
    ref: Умный курс от умных преподавателей
  - type: web-resource
    ref: Умный веб-сайт от умного веб-разработчика
  - type: slides
    ref: Умные слайды от умного презентатора

# Список лекций/конспектов
notes:
  # Номер конспекта
  - number: 1
    # Номер недели семестра, в котором была проведена лекция
    # (или в которой планировалась, если она была в итоге заменена предварительной записью)
    week: 1
    # Дата лекции, если была проведена очно или дистанционно
    # Если лекция в записи, то дата лекции по расписанию, которая была заменена записью
    date: 2026-09-04
    # Тема лекции
    title: Введение в Мой предмет
    # Код темы (для конспектов курсов, изучавшихся заочно)
    theme_code: first_theme
    # Лектор (если не указано, то указанный лектор в корне)
    lecturer: Иванов И. И.
    # Гости этой лекции
    guests:
      - Петров П. П.

    # Формат лекции:
    #  - in-person - очный формат, в аудитории
    #  - live-online - дистанционный формат
    #  - prerecorded - лекция была записана без участия аудитории
    #  - canceled - лекция была отменена
    #  - postponed - лекция была перенесена на другую дату, которая не совпадает с расписанием
    format: live-online
    # Дата переноса лекции:
    postponed_to_date: 2026-09-10

    # Статус конспекта:
    #  - planned - конспект запланирован
    #  - in-progress - создание конспекта в процессе
    #  - draft - черновой вариант конспекта доступен
    #  - done - конспект лекции готов
    #  - not-planned - конспект этой лекции не планируется
    status: done

    # Относительный путь на готовый конспект
    notes: my/mysubject/mysubject_2026_09_04.html
    # Относительный путь на исходный файл
    source_notes: my/mysubject/mysubject_2026_09_04.md

    # Комментарий к лекции
    comment: Комментарий к лекции

# Известные проблемы конспектов
issues:
  - Убрать воду
  - Добавить воздух
  - Удалить огонь
  - Заменить землю
